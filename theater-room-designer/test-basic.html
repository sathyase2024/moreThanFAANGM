<!DOCTYPE html>
<html>
<head>
    <title>Theater Room Designer - Basic Test</title>
    <style>
        .container {
            display: flex;
            height: 600px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
        }
        .left-panel {
            width: 300px;
            background: #f5f5f5;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .controls h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .viewer {
            flex: 1;
            background: #f0f0f0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        .info-panel {
            height: 100px;
            background: #f8f8f8;
            border-top: 1px solid #ddd;
            padding: 15px;
            display: flex;
        }
        .info-section {
            flex: 1;
            padding-right: 20px;
        }
        .info-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Controls -->
        <div class="left-panel">
            <div class="controls">
                <h3>Room Dimensions</h3>
                <div class="form-group">
                    <label>Length (ft)</label>
                    <input type="number" id="length" value="16" min="8" max="40">
                </div>
                <div class="form-group">
                    <label>Width (ft)</label>
                    <input type="number" id="width" value="12" min="8" max="30">
                </div>
                <div class="form-group">
                    <label>Height (ft)</label>
                    <input type="number" id="height" value="9" min="7" max="12">
                </div>
                
                <h3>Screen</h3>
                <div class="form-group">
                    <label>Size (inches)</label>
                    <input type="number" id="screen-size" value="65" min="40" max="120">
                </div>
                
                <h3>Seating</h3>
                <div class="form-group">
                    <label>Rows</label>
                    <select id="rows">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Seats per Row</label>
                    <select id="seats">
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Right Viewport -->
        <div class="right-panel">
            <div class="viewer">
                <div id="canvas-container">
                    <div id="loading-3d" style="text-align: center; color: #666;">
                        <p>Loading 3D Visualization...</p>
                        <p><small>Checking Three.js availability...</small></p>
                    </div>
                </div>
            </div>
            
            <div class="info-panel">
                <div class="info-section">
                    <h4>Design Summary</h4>
                    <div id="summary">Room: 12 × 16 × 9 ft<br>Screen: 65"<br>Seats: 6</div>
                </div>
                <div class="info-section">
                    <h4>Recommendations</h4>
                    <div id="recommendations">Calculating optimal setup...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script>
        console.log('Basic test page loaded');
        
        // Check if Three.js loaded
        if (typeof THREE !== 'undefined') {
            console.log('Three.js loaded successfully');
            document.getElementById('loading-3d').innerHTML = '<p style="color: green;">✓ Three.js loaded successfully</p><p>Initializing 3D scene...</p>';
            
            try {
                initBasic3D();
            } catch (error) {
                console.error('3D initialization error:', error);
                document.getElementById('loading-3d').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        } else {
            console.error('Three.js failed to load');
            document.getElementById('loading-3d').innerHTML = '<p style="color: red;">✗ Three.js failed to load</p><p>Check internet connection</p>';
        }
        
        function initBasic3D() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            // Camera
            const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(10, 8, 10);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);
            
            // Add simple room
            createBasicRoom(scene);
            
            // Lighting
            const light = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(light);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
            
            document.getElementById('loading-3d').style.display = 'none';
            console.log('Basic 3D scene created successfully');
            
            // Update summary
            updateBasicSummary();
        }
        
        function createBasicRoom(scene) {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(12, 16);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xd4c4a8 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);
            
            // Simple screen
            const screenGeometry = new THREE.PlaneGeometry(5, 3);
            const screenMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const screen = new THREE.Mesh(screenGeometry, screenMaterial);
            screen.position.set(0, 3, -8);
            scene.add(screen);
            
            // Simple seats
            for (let row = 0; row < 2; row++) {
                for (let seat = 0; seat < 3; seat++) {
                    const seatGeometry = new THREE.BoxGeometry(2, 1, 2);
                    const seatMaterial = new THREE.MeshLambertMaterial({ color: 0x8B7355 });
                    const seatMesh = new THREE.Mesh(seatGeometry, seatMaterial);
                    seatMesh.position.set((seat - 1) * 3, 0.5, 2 + row * 4);
                    scene.add(seatMesh);
                }
            }
        }
        
        function updateBasicSummary() {
            const length = document.getElementById('length')?.value || 16;
            const width = document.getElementById('width')?.value || 12;
            const height = document.getElementById('height')?.value || 9;
            const screenSize = document.getElementById('screen-size')?.value || 65;
            const rows = document.getElementById('rows')?.value || 2;
            const seats = document.getElementById('seats')?.value || 3;
            
            document.getElementById('summary').innerHTML = 
                `Room: ${width} × ${length} × ${height} ft<br>Screen: ${screenSize}"<br>Seats: ${rows * seats}`;
                
            document.getElementById('recommendations').innerHTML = 
                `✓ Room size looks good<br>✓ Screen size appropriate<br>✓ Seating arrangement optimal`;
        }
        
        // Bind events
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = ['length', 'width', 'height', 'screen-size', 'rows', 'seats'];
            inputs.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('change', updateBasicSummary);
                }
            });
        });
    </script>
</body>
</html>
